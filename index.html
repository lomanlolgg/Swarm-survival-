<html lang="en"><head><meta charset="utf-8">

<title>Swarm Survivor</title>
<style>
:root{--bg:#0d1020;--fg:#eef1ff;--ac:#ffd34d;--pn:#1a2040;--mu:#9aa3d0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,sans-serif;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
canvas{position:fixed;inset:0;width:100%;height:100%}

.bar{height:8px;background:#ffffff22;border-radius:4px;overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;width:0}
#hp i{background:#ff5c7a}#xp i{background:#5cf0b0}
#row{display:flex;justify-content:space-between}
.ov{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:#0d1020d9;padding:20px;text-align:center}
.box{background:var(--pn);border-radius:18px;padding:20px;max-width:340px;width:100%}
h1{margin:0 0 4px;font-size:30px;color:var(--ac)}h2{margin:0 0 10px}
p{color:var(--mu);margin:6px 0}
button{display:block;width:100%;margin:8px 0;padding:14px;border:0;border-radius:12px;background:#2c3566;color:var(--fg);font-size:16px;font-weight:700}
button.pri{background:var(--ac);color:#222}
button:disabled{opacity:.4}
#menu{align-items:flex-start;background:#0d102066;overflow-y:auto;touch-action:pan-y}
#menu .box{background:none;margin:auto;padding:8px 4px 24px}
.ic{width:1.15em;height:1.15em;vertical-align:-.22em;pointer-events:none}
.logo{font-size:54px;filter:drop-shadow(0 0 16px #ff5c7a)}
#menu h1{font-size:40px;line-height:1;letter-spacing:3px;text-shadow:0 0 24px #ffd34d88}
.tag{margin:8px 0 16px;letter-spacing:2px;text-transform:uppercase;font-size:12px}
.stats{display:flex;gap:8px;margin-bottom:12px}
.stats div{flex:1;background:var(--pn);border-radius:12px;padding:10px 4px}
.stats b{display:block;font-size:18px}
.stats span{font-size:11px;color:var(--mu);text-transform:uppercase;letter-spacing:1px}
button.big{font-size:22px;padding:18px;letter-spacing:2px;animation:pl 1.6s ease-in-out infinite;box-shadow:0 0 20px #ffd34d55}

button.dly{background:linear-gradient(90deg,#5b3cc4,#c43c8f)}
button small{font-weight:400;opacity:.8;margin-left:6px}
#menu h3{margin:18px 0 4px;font-size:13px;color:var(--mu);text-transform:uppercase;letter-spacing:2px}
button.shop{display:flex;justify-content:space-between;align-items:center;text-align:left;padding:12px 14px}
button.shop small{display:block;margin:2px 0 0;font-size:12px}
button.shop em{font-style:normal;color:var(--ac)}
#pb{position:absolute;right:0;top:34px;width:40px;height:40px;padding:0;margin:0;border-radius:50%;background:#2c3566cc;pointer-events:auto;font-size:20px;display:grid;place-items:center}
button.shop.sel{outline:2px solid var(--ac)}
#up .box{max-width:360px;padding:18px 14px 14px}#up h2{font-size:28px;color:var(--ac);margin:0}#up p{margin:2px 0 12px;font-size:13px;letter-spacing:1px;text-transform:uppercase}
button.card{display:flex;align-items:center;gap:12px;text-align:left;padding:10px 12px;background:#242c58;border-left:5px solid var(--k);animation:ci .3s ease-out both;animation-delay:var(--d)}
.card .ci{flex:none;width:46px;height:46px;border-radius:12px;background:#ffffff14;display:grid;place-items:center;font-size:32px}
.card .ct{flex:1}.card b{display:block;font-size:16px}.card small{display:block;margin:2px 0 0;font-weight:400;font-size:12px;opacity:.8}
.card em{font-style:normal;font-size:11px;font-weight:700;color:var(--k);text-transform:uppercase;letter-spacing:1px;text-align:right;white-space:nowrap}
.card:active{transform:scale(.97);background:#2e3870}
.card.o{--k:#ff7a5c}.card.w{--k:#7fb8ff}.card.d{--k:#5cf0b0}.card.u{--k:#ffd34d}

.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}.tiles div{background:#ffffff10;border-radius:10px;padding:8px}.tiles b{display:block;font-size:20px}.tiles span{font-size:11px;color:var(--mu);text-transform:uppercase;letter-spacing:1px}
.ar{display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:left;background:var(--pn);border-radius:12px;padding:10px 14px;margin:8px 0;opacity:.55}.ar.dn{opacity:1;outline:2px solid #5cf0b0}.ar b{display:block}.ar small{display:block;font-size:12px;color:var(--mu)}.ar em{font-style:normal;color:var(--ac);white-space:nowrap}
#lg input{width:100%;box-sizing:border-box;padding:14px;border-radius:12px;border:2px solid #2c3566;background:#0d1020;color:var(--fg);font-size:18px;text-align:center;margin:12px 0 4px;user-select:text;-webkit-user-select:text;outline:none}
#lg input:focus{border-color:var(--ac)}#lg .er{color:#ff5c7a;min-height:1.3em;font-size:13px;margin:4px 0 8px}
input.tx{width:100%;box-sizing:border-box;padding:12px;border-radius:12px;border:2px solid #2c3566;background:#0d1020;color:var(--fg);font-size:16px;margin:8px 0;user-select:text;-webkit-user-select:text;outline:none}
.ann{background:#3a2a6a;border-radius:10px;padding:8px 10px;font-size:13px;color:#fff;margin:0 0 10px}.ann:empty{display:none}
.ar button{width:auto;margin:0;padding:8px 10px;font-size:13px}.ar .bt{display:flex;gap:6px;flex:none}
#toast{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);right:0;width:min(290px,80vw);display:flex;align-items:center;gap:10px;box-sizing:border-box;background:#1b1b1b;border:3px solid #6b6b6b;border-right:0;border-radius:6px 0 0 6px;padding:10px 12px;color:#fff;transform:translateX(110%);transition:transform .45s cubic-bezier(.2,.8,.2,1);pointer-events:none;z-index:99;text-align:left}
#toast.show{transform:none}
#toast .ti{flex:none;width:42px;height:42px;background:#3a3a3a;border:2px solid #8b8b8b;display:grid;place-items:center}
#toast .ti img{width:28px;height:28px}
#toast small{display:block;color:#ffe14d;font-size:12px;font-weight:700}
#toast b{display:block;font-size:15px}
</style></head><body>
<canvas id="c"></canvas>
<div id="hud" style="display:none"><div id="row"><span id="tm">0:00</span><span id="lv">Lv 1</span><span id="kl">0 kills</span></div>

<div id="toast"></div>
<div class="ov" id="lg" style="z-index:50"><div class="box"><div class="logo" id="lgi" style="font-size:48px"></div><h2>Welcome, survivor</h2><p>Pick a username to start. Your progress is saved on this device.</p><input id="un" maxlength="16" placeholder="Username" autocomplete="off" autocapitalize="off" spellcheck="false"><p class="er" id="le"></p><button class="pri" data-a="login">Continue</button></div></div>

<div class="ov" id="end"><div class="box" id="eb"></div></div>
